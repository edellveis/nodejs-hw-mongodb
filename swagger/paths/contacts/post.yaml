#/swagger/paths/contacts/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: 'Lenth of name should be minimum 3 characters max 20'
            type: string
            example: 'Uta'
          phoneNumber:
            description: "Contact's phone number must be minimum 3 of characters max 20"
            type: string
            example: '+380'
          email:
            description: "Contact's email must be valid must be minimum 3 of characters max 20"
            type: string
            example: 'uta@example.com'
          isFavourite:
            description: "Contact's identifier. Can be true or false"
            type: boolean
            example: true
          contactType:
            description: 'Contact`s type. Can be personal or home must be a valid string'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
responses:
  '201':
    description: Creates a student
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a student!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
