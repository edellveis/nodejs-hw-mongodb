type: object
required:
  - _id
  - phoneNumber
  - email
  - isFavourite
  - contactType
properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Phone number'
    type: string
    example: '+1234567890'
  contactType:
    description: 'Contact type'
    type: string
    example: 'personal'
  email:
    description: 'Contact email'
    type: string
    example: uta@gmail.com
  isFavourite:
    description: 'Contact is favourite or not'
    type: boolean
    example: false
  userId:
    description: 'Contacts parent id'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: 'Link to contact photo'
    type: string
    format: uri
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
